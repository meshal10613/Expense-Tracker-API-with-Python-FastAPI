x-app-service: &app-service
  build: .
  env_file:
    - .env
  environment:
    PORT: "5000"
  expose:
    - "5000"
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3).read()",
      ]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 15s
  restart: unless-stopped

services:
  app1:
    <<: *app-service
    networks:
      - backend

  app2:
    <<: *app-service
    networks:
      - backend

  app3:
    <<: *app-service
    networks:
      - backend

  app4:
    <<: *app-service
    networks:
      - backend

  app5:
    <<: *app-service
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
      app4:
        condition: service_healthy
      app5:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge
