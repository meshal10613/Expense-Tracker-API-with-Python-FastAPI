x-app-service: &app-service
  build: .
  env_file:
    - .env
  environment:
    PORT: 5000
  expose:
    - "5000"
  restart: unless-stopped

services:
  app1:
    <<: *app-service

  app2:
    <<: *app-service

  app3:
    <<: *app-service

  app4:
    <<: *app-service

  app5:
    <<: *app-service

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app1
      - app2
      - app3
      - app4
      - app5
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
